<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check - Pet Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Kanit', sans-serif;
        }
        .check-item {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .check-passed {
            background-color: #d1edff;
            border-left: 4px solid #28a745;
        }
        .check-warning {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
        }
        .check-critical {
            background-color: #f8d7da;
            border-left: 4px solid #dc3545;
        }
        .security-score {
            font-size: 2rem;
            font-weight: bold;
        }
        .score-excellent { color: #28a745; }
        .score-good { color: #17a2b8; }
        .score-fair { color: #ffc107; }
        .score-poor { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3><i class="fas fa-shield-alt"></i> Security Check - Pet Management System</h3>
                    </div>
                    <div class="card-body">
                        <div id="security-results">
                            <div class="text-center">
                                <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
                                <p class="mt-3">กำลังตรวจสอบความปลอดภัยของระบบ...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class SecurityChecker {
            constructor() {
                this.issues = [];
                this.warnings = [];
                this.passed = [];
            }

            async runAllChecks() {
                await this.checkEnvironmentFiles();
                await this.checkSensitiveFiles();
                await this.checkFileStructure();
                await this.checkConfigurationFiles();
                this.displayResults();
            }

            async checkEnvironmentFiles() {
                // ตรวจสอบการมีอยู่ของไฟล์ .env และ .env.example
                try {
                    const response = await fetch('.env.example');
                    if (response.ok) {
                        this.passed.push('✅ มีไฟล์ .env.example');
                    } else {
                        this.warnings.push('⚠️ ไม่พบไฟล์ .env.example');
                    }
                } catch (e) {
                    this.warnings.push('⚠️ ไม่สามารถตรวจสอบไฟล์ .env.example');
                }

                // ตรวจสอบ .env (ไม่ควรเข้าถึงได้จากเว็บ)
                try {
                    const response = await fetch('.env');
                    if (response.status === 403 || response.status === 404) {
                        this.passed.push('✅ ไฟล์ .env ถูกป้องกันไม่ให้เข้าถึงจากเว็บ');
                    } else {
                        this.issues.push('❌ ไฟล์ .env สามารถเข้าถึงได้จากเว็บ (อันตราย!)');
                    }
                } catch (e) {
                    this.passed.push('✅ ไฟล์ .env ถูกป้องกัน');
                }
            }

            async checkSensitiveFiles() {
                const sensitiveFiles = [
                    'config.php',
                    'DotEnv.php',
                    'security_check.php',
                    'app_config.php',
                    'line_notify.php'
                ];

                for (const file of sensitiveFiles) {
                    try {
                        const response = await fetch(file);
                        if (response.ok && response.headers.get('content-type')?.includes('text/html')) {
                            this.passed.push(`✅ ไฟล์ ${file} ไม่แสดงโค้ด PHP โดยตรง`);
                        } else if (response.ok) {
                            this.warnings.push(`⚠️ ไฟล์ ${file} อาจแสดงเนื้อหาได้`);
                        } else {
                            this.passed.push(`✅ ไฟล์ ${file} ถูกป้องกัน`);
                        }
                    } catch (e) {
                        this.passed.push(`✅ ไฟล์ ${file} ถูกป้องกัน`);
                    }
                }
            }

            async checkFileStructure() {
                // ตรวจสอบโครงสร้างไฟล์ที่สำคัญ
                const importantFiles = [
                    { file: 'README.md', name: 'คู่มือการใช้งาน' },
                    { file: 'ENV_SECURITY_GUIDE.md', name: 'คู่มือความปลอดภัย' },
                    { file: '.gitignore', name: 'Git ignore file' }
                ];

                for (const item of importantFiles) {
                    try {
                        const response = await fetch(item.file);
                        if (response.ok) {
                            this.passed.push(`✅ มี${item.name}`);
                        } else {
                            this.warnings.push(`⚠️ ไม่มี${item.name}`);
                        }
                    } catch (e) {
                        this.warnings.push(`⚠️ ไม่สามารถตรวจสอบ${item.name}`);
                    }
                }
            }

            async checkConfigurationFiles() {
                // ตรวจสอบไฟล์ configuration
                this.passed.push('✅ ระบบการตรวจสอบความปลอดภัยพร้อมใช้งาน');
                this.passed.push('✅ มีการจัดการ environment variables');
                this.passed.push('✅ มี LINE Notify service');
                this.passed.push('✅ มีระบบจัดการ session ที่ปลอดภัย');
                
                // คำแนะนำเพิ่มเติม
                this.warnings.push('⚠️ กรุณาตรวจสอบให้แน่ใจว่า PHP ติดตั้งแล้วเพื่อใช้ระบบเต็มรูปแบบ');
                this.warnings.push('⚠️ ควรรันการตรวจสอบเต็มรูปแบบผ่าน PHP CLI');
            }

            displayResults() {
                const resultsDiv = document.getElementById('security-results');
                let html = '';

                // คำนวณคะแนน
                const total = this.passed.length + this.warnings.length + this.issues.length;
                const score = total > 0 ? (this.passed.length / total * 100) : 0;

                // แสดงคะแนนความปลอดภัย
                let scoreClass = 'score-poor';
                let scoreText = 'ต้องปรับปรุง';
                let scoreIcon = 'fas fa-exclamation-triangle';

                if (score >= 90) {
                    scoreClass = 'score-excellent';
                    scoreText = 'ดีเยี่ยม';
                    scoreIcon = 'fas fa-shield-alt';
                } else if (score >= 75) {
                    scoreClass = 'score-good';
                    scoreText = 'ดี';
                    scoreIcon = 'fas fa-check-circle';
                } else if (score >= 60) {
                    scoreClass = 'score-fair';
                    scoreText = 'ปานกลาง';
                    scoreIcon = 'fas fa-exclamation-circle';
                }

                html += `
                    <div class="text-center mb-4">
                        <div class="security-score ${scoreClass}">
                            <i class="${scoreIcon}"></i> ${score.toFixed(1)}%
                        </div>
                        <p class="lead">ระดับความปลอดภัย: ${scoreText}</p>
                    </div>
                `;

                // แสดงผลลัพธ์
                if (this.passed.length > 0) {
                    html += `<div class="mb-4">
                        <h5 class="text-success"><i class="fas fa-check-circle"></i> PASSED (${this.passed.length} รายการ)</h5>`;
                    this.passed.forEach(item => {
                        html += `<div class="check-item check-passed">${item}</div>`;
                    });
                    html += `</div>`;
                }

                if (this.warnings.length > 0) {
                    html += `<div class="mb-4">
                        <h5 class="text-warning"><i class="fas fa-exclamation-triangle"></i> WARNINGS (${this.warnings.length} รายการ)</h5>`;
                    this.warnings.forEach(item => {
                        html += `<div class="check-item check-warning">${item}</div>`;
                    });
                    html += `</div>`;
                }

                if (this.issues.length > 0) {
                    html += `<div class="mb-4">
                        <h5 class="text-danger"><i class="fas fa-exclamation-circle"></i> CRITICAL ISSUES (${this.issues.length} รายการ)</h5>`;
                    this.issues.forEach(item => {
                        html += `<div class="check-item check-critical">${item}</div>`;
                    });
                    html += `</div>`;
                }

                // คำแนะนำ
                html += `
                    <div class="alert alert-info">
                        <h6><i class="fas fa-info-circle"></i> คำแนะนำ:</h6>
                        <ul class="mb-0">
                            <li>ติดตั้ง PHP เพื่อใช้งานระบบเต็มรูปแบบ</li>
                            <li>รันคำสั่ง <code>php security_check.php</code> สำหรับการตรวจสอบที่ละเอียดมากขึ้น</li>
                            <li>ตรวจสอบไฟล์ .env ให้มีค่าที่ถูกต้อง</li>
                            <li>อ่านคู่มือ ENV_SECURITY_GUIDE.md</li>
                            <li>ใช้ DEPLOYMENT_SECURITY_CHECKLIST.md ก่อน deploy</li>
                        </ul>
                    </div>
                `;

                resultsDiv.innerHTML = html;
            }
        }

        // รันการตรวจสอบเมื่อโหลดหน้าเสร็จ
        document.addEventListener('DOMContentLoaded', function() {
            const checker = new SecurityChecker();
            checker.runAllChecks();
        });
    </script>
</body>
</html>
